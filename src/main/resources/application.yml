server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rocgit-knife4j
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# SpringDoc OpenAPI 配置（OpenAPI 3.0 + Knife4j）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-flat-param-object: false

# Knife4j 增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn                    # 中文界面
    enable-version: true               # 启用版本
    enable-swagger-models: true        # 显示实体类
    swagger-model-name: 实体类列表      # 实体类列表标题
    enable-document-manage: true       # 文档管理
    enable-run-script: true            # 测试脚本

# JWT 配置
jwt:
  secret: rocgit-secret-key-2026-very-long-string
  expiration: 604800  # 7 天（秒）

logging:
  level:
    root: INFO
    com.rocgit: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
