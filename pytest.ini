[pytest]
testpaths = .
python_files = test_*.py
norecursedirs = .* node_modules artifacts knife4j-spring testing dist unpackage 测试结果
addopts = -ra -p no:cacheprovider -p testing.options
markers =
    case(id, module, name, inputs, expected, method, goal, stage): 中文用例元数据
    remote: 独立服务器测试实例
    whitebox: 执行实际 JavaScript 或 Java 内部代码
