server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rocgit-knife4j
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/roc_git?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: rocgit
    password: rocgit2026
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SpringDoc OpenAPI 配置（OpenAPI 3.0 + Knife4j）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-flat-param-object: false

# Knife4j 增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn                    # 中文界面
    enable-version: true               # 启用版本
    enable-swagger-models: true        # 显示实体类
    swagger-model-name: 实体类列表      # 实体类列表标题
    enable-document-manage: true       # 文档管理
    enable-run-script: true            # 测试脚本

# JWT 配置
jwt:
  secret: rocgit-secret-key-2026-very-long-string
  expiration: 604800  # 7 天（秒）

# 文件存储 & 微信小程序
# AppID/AppSecret 通过环境变量注入（systemd EnvironmentFile），不写入仓库
rocgit:
  file:
    storage-dir: /opt/roc-git/files
  wechat:
    appid: ${ROCGIT_WECHAT_APPID:}
    secret: ${ROCGIT_WECHAT_SECRET:}

logging:
  level:
    root: INFO
    com.rocgit: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
