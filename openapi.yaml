# ROC-git 课程小组文档协作管理平台 - OpenAPI 3.0 文档

openapi: 3.0.3
info:
  title: ROC-git 课程小组协作管理平台 API
  description: |
    ROC-git 是一个面向高校学生课程小组的轻量化协作管理平台。
    
    ## 核心功能
    - 小组管理：创建、加入、邀请成员
    - 项目协作：多阶段项目、任务分配、文件管理
    - 审核机制：首创"挂单审核"模式
    - 版本控制：文件版本追溯与回溯
    - 结项分享：生成分享链接展示协作过程
    
    ## 认证方式
    - JWT Token 认证
    - Header: `Authorization: Bearer <token>`
    
    ## 通用响应格式
    ```json
    {
      "code": 0,
      "message": "success",
      "data": {},
      "timestamp": 1694697600000
    }
    ```
    
    ## 错误码说明
    | 错误码 | 含义 |
    |:------:|------|
    | 0 | 成功 |
    | 400 | 请求参数错误 |
    | 401 | 未认证 |
    | 403 | 无权限 |
    | 404 | 资源不存在 |
    | 409 | 资源冲突 |
    | 429 | 请求频繁 |
    | 500 | 服务器错误 |
  version: 1.0.0
  contact:
    name: ROC-git Team
    email: support@rocgit.com

servers:
  - url: https://api.rocgit.com/api/v1
    description: 生产环境
  - url: https://api-test.rocgit.com/api/v1
    description: 测试环境
  - url: http://localhost:8080/api/v1
    description: 本地开发

tags:
  - name: 通用
    description: 通用接口（健康检查、配置、上传等）
  - name: 用户
    description: 用户认证与个人信息
  - name: 小组
    description: 小组管理相关接口
  - name: 项目
    description: 项目管理相关接口
  - name: 文件
    description: 文件上传、预览、审核等
  - name: 版本
    description: 文件版本管理
  - name: 任务
    description: 任务分配与管理
  - name: 协作
    description: 研讨记录、决策、成果等
  - name: 消息
    description: 消息通知与订阅
  - name: 分享
    description: 结项分享相关接口

paths:
  # ============================================
  # 通用接口
  # ============================================
  /health:
    get:
      tags:
        - 通用
      summary: 健康检查
      description: 接口健康检查，返回服务状态
      operationId: healthCheck
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      security: []

  /config:
    get:
      tags:
        - 通用
      summary: 获取服务端配置
      description: 获取前端需要的配置信息
      operationId: getConfig
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
      security: []

  /upload:
    post:
      tags:
        - 通用
      summary: 文件上传
      description: 通用文件上传接口，支持文件、头像、海报等类型
      operationId: uploadFile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'

  /upload/credentials:
    post:
      tags:
        - 通用
      summary: 获取上传凭证
      description: 获取直传到OSS的分片上传凭证
      operationId: getUploadCredentials
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCredentialsResponse'

  # ============================================
  # 用户接口
  # ============================================
  /user/login:
    post:
      tags:
        - 用户
      summary: 微信登录
      description: 用户通过微信code登录，获取JWT Token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /user/profile:
    get:
      tags:
        - 用户
      summary: 获取个人信息
      operationId: getProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
    put:
      tags:
        - 用户
      summary: 更新个人信息
      operationId: updateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /user/login-history:
    get:
      tags:
        - 用户
      summary: 获取登录历史
      operationId: getLoginHistory
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginHistoryResponse'

  /user/logout:
    post:
      tags:
        - 用户
      summary: 退出登录
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /user/refresh-token:
    post:
      tags:
        - 用户
      summary: 刷新Token
      description: 使用refreshToken换取新的accessToken
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: 刷新Token
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'

  /user/contribution-stats:
    get:
      tags:
        - 用户
      summary: 获取用户贡献统计
      operationId: getContributionStats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionStatsResponse'

  /user/bind-wechat:
    post:
      tags:
        - 用户
      summary: 绑定微信信息
      description: 绑定额外微信信息（如有多个小程序）
      operationId: bindWechat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindWechatRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /feedback:
    post:
      tags:
        - 用户
      summary: 意见反馈
      operationId: submitFeedback
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============================================
  # 小组接口
  # ============================================
  /group/create:
    post:
      tags:
        - 小组
      summary: 创建小组
      operationId: createGroup
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'

  /group/join:
    post:
      tags:
        - 小组
      summary: 加入小组
      operationId: joinGroup
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - inviteCode
              properties:
                inviteCode:
                  type: string
                  description: 8位邀请码
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /group/validate-invite-code:
    post:
      tags:
        - 小组
      summary: 验证邀请码
      description: 加入前预览小组信息
      operationId: validateInviteCode
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - inviteCode
              properties:
                inviteCode:
                  type: string
                  description: 邀请码
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateInviteCodeResponse'

  /group/my-list:
    get:
      tags:
        - 小组
      summary: 获取我的小组列表
      operationId: getMyGroups
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'

  /group/{groupId}:
    get:
      tags:
        - 小组
      summary: 获取小组详情
      operationId: getGroupDetail
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetailResponse'
    put:
      tags:
        - 小组
      summary: 修改小组信息
      operationId: updateGroup
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - 小组
      summary: 解散小组
      description: 组长解散小组，需二次确认
      operationId: deleteGroup
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirmText
              properties:
                confirmText:
                  type: string
                  description: 输入"确认解散"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /group/{groupId}/leave:
    post:
      tags:
        - 小组
      summary: 退出小组
      operationId: leaveGroup
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /group/{groupId}/members:
    get:
      tags:
        - 小组
      summary: 获取小组成员列表
      operationId: getGroupMembers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'
    delete:
      tags:
        - 小组
      summary: 移除成员
      description: 组长移除组员
      operationId: removeMember
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            description: 用户ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /group/{groupId}/member/{userId}/remark:
    put:
      tags:
        - 小组
      summary: 设置成员备注
      description: 组长给成员设置备注名
      operationId: setMemberRemark
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - remark
              properties:
                remark:
                  type: string
                  description: 备注名（1-10字）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /group/{groupId}/transfer-leader:
    put:
      tags:
        - 小组
      summary: 变更组长
      description: 组长权限转移
      operationId: transferLeader
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newLeaderId
              properties:
                newLeaderId:
                  type: integer
                  format: int64
                  description: 新组长用户ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /group/{groupId}/invite-code:
    put:
      tags:
        - 小组
      summary: 重新生成邀请码
      operationId: regenerateInviteCode
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegenerateInviteCodeResponse'

  /group/{groupId}/stats:
    get:
      tags:
        - 小组
      summary: 获取小组统计
      operationId: getGroupStats
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupStatsResponse'

  /group/{groupId}/member-stats:
    get:
      tags:
        - 小组
      summary: 获取成员贡献统计
      operationId: getMemberStats
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberStatsResponse'

  # ============================================
  # 项目接口
  # ============================================
  /project/create:
    post:
      tags:
        - 项目
      summary: 创建项目
      operationId: createProject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /project/list:
    get:
      tags:
        - 项目
      summary: 获取项目列表
      operationId: getProjectList
      security:
        - BearerAuth: []
      parameters:
        - name: groupId
          in: query
          schema:
            type: integer
            format: int64
          description: 筛选小组
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed, archived]
          description: 筛选状态
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'

  /project/{projectId}:
    get:
      tags:
        - 项目
      summary: 获取项目详情
      operationId: getProjectDetail
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
    put:
      tags:
        - 项目
      summary: 更新项目
      operationId: updateProject
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - 项目
      summary: 删除项目
      operationId: deleteProject
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /project/{projectId}/copy:
    post:
      tags:
        - 项目
      summary: 复制项目
      operationId: copyProject
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyProjectRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /project/{projectId}/complete:
    post:
      tags:
        - 项目
      summary: 项目结项
      operationId: completeProject
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /project/{projectId}/progress:
    get:
      tags:
        - 项目
      summary: 获取项目进度
      operationId: getProjectProgress
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProgressResponse'

  /project/{projectId}/activities:
    get:
      tags:
        - 项目
      summary: 获取项目操作记录
      description: 获取项目动态（聚合操作日志+系统事件）
      operationId: getProjectActivities
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: type
          in: query
          schema:
            type: string
            enum: [file, task, stage, member]
          description: 筛选类型
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityListResponse'

  /project/{projectId}/task-stats:
    get:
      tags:
        - 项目
      summary: 获取项目任务统计
      operationId: getTaskStats
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatsResponse'

  # 阶段管理
  /project/{projectId}/stage:
    post:
      tags:
        - 项目
      summary: 添加阶段
      operationId: addStage
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddStageRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageResponse'

  /project/{projectId}/stage/order:
    put:
      tags:
        - 项目
      summary: 排序阶段
      description: 调整阶段的顺序
      operationId: reorderStages
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stageIds
              properties:
                stageIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: 阶段ID数组（按新顺序排列）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /project/{projectId}/stage/{stageId}:
    get:
      tags:
        - 项目
      summary: 获取阶段详情
      operationId: getStageDetail
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/StageId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageDetailResponse'
    put:
      tags:
        - 项目
      summary: 更新阶段
      operationId: updateStage
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/StageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStageRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - 项目
      summary: 删除阶段
