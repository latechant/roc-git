      operationId: getShareDiscussions
      security: []
      parameters:
        - name: shareToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareDiscussionListResponse'

  /share/{shareToken}/decisions:
    get:
      tags:
        - 分享
      summary: 获取分享决策列表（访客）
      operationId: getShareDecisions
      security: []
      parameters:
        - name: shareToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareDecisionListResponse'

# ============================================
# 组件定义
# ============================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token 认证

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: 页码

    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: 每页大小

    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    # 通用响应
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object
          nullable: true
        timestamp:
          type: integer
          format: int64

    # 健康检查
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                version:
                  type: string
                uptime:
                  type: integer
                db:
                  type: string
                redis:
                  type: string

    # 配置
    ConfigResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                uploadMaxSize:
                  type: integer
                  example: 52428800
                allowedFileTypes:
                  type: array
                  items:
                    type: string
                versionTemplate:
                  type: string
                announcement:
                  type: string

    # 上传相关
    UploadRequest:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
        type:
          type: string
          enum: [file, avatar, poster]
        projectId:
          type: integer
          format: int64

    UploadResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                fileId:
                  type: string
                url:
                  type: string
                filename:
                  type: string
                size:
                  type: integer
                type:
                  type: string

    UploadCredentialsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                uploadId:
                  type: string
                uploadUrl:
                  type: string
                expiresIn:
                  type: integer

    # 用户相关
    LoginRequest:
      type: object
      required:
        - code
        - nickname
        - avatarUrl
      properties:
        code:
          type: string
          description: 微信登录code
        nickname:
          type: string
          description: 用户昵称
        avatarUrl:
          type: string
          description: 用户头像URL

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
